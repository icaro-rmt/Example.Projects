services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: example_projects
      POSTGRES_USER: example_projects
      POSTGRES_PASSWORD: example_projects_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
